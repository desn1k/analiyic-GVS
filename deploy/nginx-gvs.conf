# /etc/nginx/sites-available/gvs
# Serves the built React app and reverse-proxies the API to uvicorn on 127.0.0.1:8000.
# Replace `gvs.example.com` with your real domain (or use `_` / the server's IP for no domain).

server {
    listen 80;
    server_name gvs.example.com;

    root /opt/gvs/frontend/dist;
    index index.html;

    # Почасовые приборные файлы могут достигать ~1.5 ГБ.
    client_max_body_size 2g;
    client_body_timeout 3600s;   # долгая заливка большого файла

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Разбор большого файла занимает минуты — не рвём соединение по таймауту.
        proxy_request_buffering off;   # стримим тело в бэкенд, не буферизуем на диск nginx
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
