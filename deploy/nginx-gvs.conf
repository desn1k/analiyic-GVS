# /etc/nginx/sites-available/gvs
# Serves the built React app and reverse-proxies the API to uvicorn on 127.0.0.1:8000.
# Replace `gvs.example.com` with your real domain (or use `_` / the server's IP for no domain).

server {
    listen 80;
    server_name gvs.example.com;

    root /opt/gvs/frontend/dist;
    index index.html;

    client_max_body_size 25m;  # allow reasonably large .xlsx uploads

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
